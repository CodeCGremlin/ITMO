<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>First Lab</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/main.css">
    <script defer src="index.js"></script>
</head>

<header>
    <div id="info">
        <a>Lab Web №1</a>
        <br/> Anton Davidyuk Yurievich <br/>
        variant 503517
        <br/> P3210 <br/>
    </div>
</header>

<body>
<main class="container">
    <section class="input-section">
        <form action="/" method="GET" id="data-form">
            <fieldset id="xs">
                <legend>Select X:</legend>
                <input type="button" name="x" value="-5">
                <input type="button" name="x" value="-4">
                <input type="button" name="x" value="-3">
                <input type="button" name="x" value="-2">
                <input type="button" name="x" value="-1">
                <input type="button" name="x" value="0">
                <input type="button" name="x" value="1">
                <input type="button" name="x" value="2">
                <input type="button" name="x" value="3">
            </fieldset>

            <label for="y">Select Y:</label>
            <input type="number" id="y" name="y" step="any" min="-3" max="3" required>

            <label for="r">Select R:</label>
            <select id="r" name="r" required>
                <option value="1.0">1.0</option>
                <option value="1.5">1.5</option>
                <option value="2.0">2.0</option>
                <option value="2.5">2.5</option>
                <option value="3.0">3.0</option>
            </select>

            <button type="submit">Submit</button>
        </form>
        <div id="error" hidden></div>

        <button type="button" id="clear-history-btn">Clear history</button>
    </section>
    <section class="results-section">
        <canvas id="graph" width="300" height="300"></canvas>

        <div class="pagination">
            <button id="prev-page" disabled>Previous</button>
            <span id="page-info">Page 1 of 1</span>
            <button id="next-page" disabled>Next</button>
        </div>

        <table id="result-table">
            <tr>
                <th>x</th>
                <th>y</th>
                <th>r</th>
                <th>time</th>
                <th>execution time</th>
                <th>result</th>
            </tr>
        </table>
    </section>
</main>
<footer id="copyright">
    <a> OOO.Gremlini </a>
</footer>
</body>
</html>
