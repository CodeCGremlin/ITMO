version: '3.8'
services:
  wildfly:
    image: quay.io/wildfly/wildfly:26.1.3.Final
    ports:
      - "8080:8080"
      - "9990:9990"
    volumes:
      - ./build/libs/weblab2.war:/opt/jboss/wildfly/standalone/deployments/weblab2.war
    command: >
      bash -c "
        /opt/jboss/wildfly/bin/add-user.sh admin admin --silent &&
        /opt/jboss/wildfly/bin/standalone.sh -b 0.0.0.0 -bmanagement 0.0.0.0
      "